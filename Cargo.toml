[package]
name = "rsxtk"
version = "0.5.2"
edition = "2024"
authors = ["Jon Marcum <jrmarcum@gmail.com>"]
description = "A high-performance Rust WASM Toolkit for managing and running WASI scripts, WAT, and WASM modules."
license = "MIT OR Apache-2.0"
repository = "https://github.com/synapticforge1/rsxtk"
documentation = "https://github.com/synapticforge1/rsxtk"
readme = "README.md"
# Project memory, CI, the release scripts, the CLI-surface golden and the licence inventory are for
# working on rsxtk, not for crate users; they stay public on GitHub.
exclude = ["cmem/", ".github/", "scripts/", "surface.txt", "licences.txt"]
keywords = ["rust","wasm", "wasi", "toolkit", "cli"]
categories = ["development-tools", "wasm"]

[dependencies]
# Standard utilities
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Wasmtime: only what rsxtk uses (Cranelift, the runtime, WASI preview 1).
# - default-features = false keeps aws-lc-sys (cmake + NASM) and every other C library out: with
#   these features 50.x builds the same two small C files as 40.x did, through `cc` (wasmtime's
#   helpers.c; wasmtime-internal-fiber's windows.c) and nothing else (measured 2026-11-20).
# - 50.x since 2026-11-20: 40.x had 32 unpatched advisories (cargo audit).
# - `anyhow`: wasmtime's own error type converts into anyhow's (pure Rust; anyhow is already here).
wasmtime = { version = "50.0.3", default-features = false, features = ["cranelift", "runtime", "anyhow"] }
wasmtime-wasi = { version = "50.0.3", default-features = false, features = ["p1"] }

# Wasm Tooling (Pure Rust)
wat = "1.244.0"
wasmprinter = "0.244.0"
walrus = "0.24.4"

# [win-x64] Reqwest: native TLS (uses Windows SChannel — no cmake/NASM required)
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "json", "http2", "native-tls"] }

# The dev profile (clippy and `cargo test`) keeps line tables for backtraces but no full debug
# info: wasmtime and Cranelift's debug info was most of a 4.3 GB target dir (2026-11-19). Only
# rsxtk's own builds read this; `cargo install` uses the release profile.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true